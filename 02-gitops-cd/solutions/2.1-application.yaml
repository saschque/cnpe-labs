apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # Ressourcen beim Löschen der App mitlöschen
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
# CLI-Alternative:
#   argocd app create guestbook --repo https://github.com/argoproj/argocd-example-apps \
#     --path guestbook --dest-server https://kubernetes.default.svc --dest-namespace guestbook \
#     --sync-policy automated --auto-prune --self-heal --sync-option CreateNamespace=true
