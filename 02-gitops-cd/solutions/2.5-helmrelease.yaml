apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
  namespace: flux-system
spec:
  type: oci
  interval: 10m
  url: oci://ghcr.io/stefanprodan/charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: podinfo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-helm
  namespace: podinfo-helm
spec:
  interval: 5m
  chart:
    spec:
      chart: podinfo
      version: ">=6.0.0"
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
  values:
    replicaCount: 2
    ui:
      message: "Hello CNPE"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
      strategy: rollback
# Debug: flux get helmreleases -A ; kubectl -n podinfo-helm describe helmrelease podinfo-helm
# Newer alternative to HelmRepository type=oci: source "OCIRepository" + spec.chartRef
