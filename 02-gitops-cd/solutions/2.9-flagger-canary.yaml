apiVersion: v1
kind: Namespace
metadata:
  name: canary-demo
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: canary-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.0
          ports:
            - name: http
              containerPort: 9898
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: podinfo
  namespace: canary-demo
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo
  service:                  # Flagger creates podinfo, podinfo-primary, podinfo-canary + VirtualService
    port: 9898
    targetPort: 9898
  analysis:
    interval: 30s
    threshold: 5            # after 5 failed checks → rollback
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99
        interval: 1m
      - name: request-duration
        thresholdRange:
          max: 500          # milliseconds
        interval: 1m
    webhooks:
      - name: load-test     # optional: generates traffic so metrics exist
        url: http://flagger-loadtester.test/
        timeout: 5s
        metadata:
          cmd: "hey -z 1m -q 10 -c 2 http://podinfo-canary.canary-demo:9898/"
# Trigger a rollout:
#   kubectl -n canary-demo set image deploy/podinfo podinfo=ghcr.io/stefanprodan/podinfo:6.7.1
#   kubectl -n canary-demo get canary -w
#   kubectl -n canary-demo describe canary podinfo     # Events: "Advance podinfo canary weight 10" …
# Load-Tester (optional): helm upgrade -i flagger-loadtester flagger/loadtester -n test --create-namespace
#
# Blue/green instead of canary: remove stepWeight/maxWeight and use instead
#   analysis:
#     iterations: 10       # test 10 × interval, then switch completely
# A/B testing: additionally analysis.match with header rules (e.g. x-canary: insider).
