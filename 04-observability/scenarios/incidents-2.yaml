# Incident scenarios round 2 (task 4.12) – just apply, no spoilers.
apiVersion: v1
kind: Namespace
metadata:
  name: incidents-2
---
apiVersion: v1
kind: Secret
metadata:
  name: billing-db
  namespace: incidents-2
stringData:
  username: billing
  pass: s3cr3t
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s8-billing
  namespace: incidents-2
spec:
  replicas: 1
  selector: {matchLabels: {app: s8-billing}}
  template:
    metadata: {labels: {app: s8-billing}}
    spec:
      containers:
        - name: billing
          image: busybox:1.36
          command: ["sh", "-c", "echo connecting as $DB_USER; sleep 3600"]
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: billing-db, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: billing-db, key: password}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s9-search
  namespace: incidents-2
spec:
  replicas: 1
  selector: {matchLabels: {app: s9-search}}
  template:
    metadata: {labels: {app: s9-search}}
    spec:
      containers:
        - name: search
          image: busybox:1.36
          # the app needs 20 s to start (loading the index), then HTTP on 8080
          command: ["sh", "-c", "echo loading index; sleep 20; mkdir -p /www; echo ok > /www/healthz; httpd -f -p 8080 -h /www"]
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: incidents-2
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fast-ssd
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s10-uploads
  namespace: incidents-2
spec:
  replicas: 1
  selector: {matchLabels: {app: s10-uploads}}
  template:
    metadata: {labels: {app: s10-uploads}}
    spec:
      containers:
        - name: uploads
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: uploads}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s11-sync
  namespace: incidents-2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s11-sync
  namespace: incidents-2
spec:
  replicas: 1
  selector: {matchLabels: {app: s11-sync}}
  template:
    metadata: {labels: {app: s11-sync}}
    spec:
      serviceAccountName: s11-sync
      containers:
        - name: sync
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              while true; do
                code=$(curl -s -o /tmp/out -w '%{http_code}' --cacert $SA/ca.crt \
                  -H "Authorization: Bearer $(cat $SA/token)" \
                  https://kubernetes.default.svc/api/v1/namespaces/incidents-2/configmaps)
                if [ "$code" != "200" ]; then echo "sync failed: HTTP $code"; cat /tmp/out; exit 1; fi
                echo "synced $(grep -c '"name"' /tmp/out) objects"; sleep 10
              done
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lockdown-egress
  namespace: incidents-2
spec:
  podSelector:
    matchLabels: {app: s12-resolver}
  policyTypes: [Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s12-resolver
  namespace: incidents-2
spec:
  replicas: 1
  selector: {matchLabels: {app: s12-resolver}}
  template:
    metadata: {labels: {app: s12-resolver}}
    spec:
      containers:
        - name: resolver
          image: busybox:1.36
          command: ["sh", "-c", "while true; do nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1 || { echo 'DNS lookup failed'; exit 1; }; echo resolved; sleep 10; done"]
