apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  # labels: {release: kps}   # if ruleSelector requires it
spec:
  groups:
    - name: platform.recording
      rules:
        - record: namespace:container_cpu_usage:sum_rate5m
          expr: sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
    - name: platform.alerts
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} restarted {{ $value | humanize }} times in 15 min."
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="demo", status=~"5.."}[5m]))
              /
            sum(rate(http_requests_total{namespace="demo"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High error rate for podinfo"
            description: "{{ $value | humanizePercentage }} of requests return 5xx."
---
# Bonus: AlertmanagerConfig (CRD of the Prometheus Operator)
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: critical-webhook
  namespace: monitoring
spec:
  route:
    receiver: webhook
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    repeatInterval: 4h
    matchers:
      - name: severity
        value: critical
        matchType: "="
  receivers:
    - name: webhook
      webhookConfigs:
        - url: http://alert-sink.monitoring:8080
          sendResolved: true
# Watch out: Alertmanager must select AlertmanagerConfigs
#   (alertmanager.alertmanagerSpec.alertmanagerConfigSelector in the Helm chart).
# Validate rules: promtool check rules <file>  (extract the rules from the CRD first)
