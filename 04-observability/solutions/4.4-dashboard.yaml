apiVersion: v1
kind: ConfigMap
metadata:
  name: podinfo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"      # Grafana-Sidecar lädt die Datei automatisch
data:
  podinfo.json: |
    {
      "title": "Podinfo",
      "uid": "podinfo",
      "schemaVersion": 39,
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "type": "timeseries",
          "title": "Request-Rate",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [
            {"expr": "sum by (status) (rate(http_requests_total{namespace=\"demo\"}[5m]))", "legendFormat": "{{status}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "p95-Latenz",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo\"}[5m])))"}
          ]
        }
      ]
    }
# Erscheint nicht? Sidecar-Logs prüfen:
#   kubectl -n monitoring logs deploy/kps-grafana -c grafana-sc-dashboard
