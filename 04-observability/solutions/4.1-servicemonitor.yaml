apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: podinfo
  namespace: demo
  # labels:
  #   release: kps     # needed if serviceMonitorSelector filters on this label
spec:
  selector:
    matchLabels:
      app: podinfo     # label of the SERVICE (kubectl expose copies app=podinfo)
  namespaceSelector:
    matchNames: ["demo"]
  endpoints:
    - port: http       # port NAME of the service, not the number
      path: /metrics
      interval: 15s
# Question 3: Which labels does Prometheus expect?
#   kubectl -n monitoring get prometheus -o jsonpath='{.items[0].spec.serviceMonitorSelector}'
# → add the label release: kps to the ServiceMonitor.
# Target DOWN / missing? Check: service labels, port name, endpoints exist,
# serviceMonitorNamespaceSelector, Prometheus logs (container prometheus).
