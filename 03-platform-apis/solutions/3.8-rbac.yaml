apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-author
  namespace: team-a
rules:
  - apiGroups: ["platform.example.org"]
    resources: ["webapps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-author
  namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webapp-author
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: team-a-devs
# Imperative:
#   kubectl -n team-a create role webapp-author --verb=get,list,watch,create,update,patch,delete \
#     --resource=webapps.platform.example.org
#   (then add the second rule with kubectl edit)
#   kubectl -n team-a create rolebinding webapp-author --role=webapp-author --group=team-a-devs
# Test:
#   kubectl auth can-i create webapps.platform.example.org -n team-a --as=u --as-group=team-a-devs  # yes
#   kubectl auth can-i create deployments -n team-a --as=u --as-group=team-a-devs                  # no
#   kubectl auth can-i list deployments -n team-a --as=u --as-group=team-a-devs                    # yes
