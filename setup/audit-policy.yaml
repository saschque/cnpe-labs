apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  # Secrets nur mit Metadaten loggen (keine Inhalte!)
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps"]
  # Änderungen an RBAC vollständig loggen
  - level: RequestResponse
    resources:
      - group: rbac.authorization.k8s.io
  # Schreibzugriffe auf Workloads
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: apps
  # Rauschen reduzieren
  - level: None
    users: ["system:kube-proxy"]
  - level: None
    nonResourceURLs: ["/healthz*", "/readyz*", "/livez*", "/version"]
  - level: Metadata
