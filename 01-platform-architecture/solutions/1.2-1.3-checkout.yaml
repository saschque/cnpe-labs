# Fast way (imperative):
#   kubectl -n team-payments create deploy checkout --image=registry.k8s.io/hpa-example --port=80
#   kubectl -n team-payments set resources deploy checkout --requests=cpu=200m
#   kubectl -n team-payments expose deploy checkout --port=80
#   kubectl -n team-payments autoscale deploy checkout --min=2 --max=8 --cpu-percent=60
#   (add the behavior section afterwards with kubectl edit)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-critical
value: 1000000
globalDefault: false
description: "Kritische Plattform-Komponenten"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: team-payments
  labels:
    app: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      priorityClassName: platform-critical          # 1.3
      topologySpreadConstraints:                     # 1.3
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: checkout
      containers:
        - name: checkout
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: team-payments
spec:
  selector:
    app: checkout
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout
  namespace: team-payments
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout-pdb
  namespace: team-payments
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: checkout
