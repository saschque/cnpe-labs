# Find the provisioner: kubectl get storageclass
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer   # PVC stays Pending until a pod is scheduled
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-data
  namespace: team-payments
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fast-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ledger
  namespace: team-payments
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ledger-data
# Why Pending? WaitForFirstConsumer delays binding/provisioning until the scheduler
# has picked a node – so the volume ends up in the right zone/on the right node.
