apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: ci
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-updater
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
---
# ClusterRole + RoleBinding = permissions only in this namespace (reusable!)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: gb-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-updater
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: gb-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-updater
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployer-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-reader
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: ci
# Imperative:
#   kubectl -n ci create sa deployer
#   kubectl create clusterrole deployment-updater --verb=get,list,patch,update --resource=deployments.apps
#   kubectl -n gb-dev create rolebinding deployer --clusterrole=deployment-updater --serviceaccount=ci:deployer
#   kubectl create clusterrole namespace-reader --verb=get,list,watch --resource=namespaces
#   kubectl create clusterrolebinding deployer-namespace-reader --clusterrole=namespace-reader --serviceaccount=ci:deployer
#   kubectl -n ci patch sa deployer -p '{"automountServiceAccountToken": false}'
# Tests:
#   SA=system:serviceaccount:ci:deployer
#   kubectl auth can-i patch deploy -n gb-dev --as=$SA      # yes
#   kubectl auth can-i delete deploy -n gb-dev --as=$SA     # no
#   kubectl auth can-i patch deploy -n gb-prod --as=$SA     # no
#   kubectl auth can-i list ns --as=$SA                     # yes
