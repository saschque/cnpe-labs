apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredlabels           # must be lowercase(kind)
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredLabels
      validation:
        openAPIV3Schema:
          type: object
          properties:
            labels:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredlabels

        violation[{"msg": msg, "details": {"missing_labels": missing}}] {
          provided := {label | input.review.object.metadata.labels[label]}
          required := {label | label := input.parameters.labels[_]}
          missing := required - provided
          count(missing) > 0
          msg := sprintf("Missing labels: %v", [missing])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: ns-must-have-owner
spec:
  enforcementAction: dryrun        # later: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace"]
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
  parameters:
    labels: ["owner"]
---
# Bonus: allowed registries
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedrepos
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRepos
      validation:
        openAPIV3Schema:
          type: object
          properties:
            repos:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedrepos

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not startswith_any(container.image, input.parameters.repos)
          msg := sprintf("Image %v is not from an allowed registry %v", [container.image, input.parameters.repos])
        }

        startswith_any(image, repos) {
          startswith(image, repos[_])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: allowed-registries
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["shop"]
  parameters:
    repos: ["ghcr.io/", "registry.k8s.io/"]
# Note: Gatekeeper v3.19+ / newer templates also accept Rego v1 (import rego.v1,
# "violation contains ... if"). The syntax above (v0) still works as the default.
# Audit:
#   kubectl get k8srequiredlabels ns-must-have-owner -o jsonpath='{.status.totalViolations}'; echo
#   kubectl get k8srequiredlabels ns-must-have-owner -o json | jq '.status.violations[] | {name, message}'
# Switch:
#   kubectl patch k8srequiredlabels ns-must-have-owner --type=merge -p '{"spec":{"enforcementAction":"deny"}}'
#   kubectl create ns no-owner        → admission webhook "validation.gatekeeper.sh" denied the request
# Template status:  kubectl get constrainttemplate k8srequiredlabels -o jsonpath='{.status.created}'
