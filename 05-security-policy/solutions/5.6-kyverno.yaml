apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-team-label
spec:
  validationFailureAction: Enforce     # newer versions: validate.failureAction per rule
  background: true
  rules:
    - name: check-team
      match:
        any:
          - resources:
              kinds: ["Deployment"]
      exclude:
        any:
          - resources:
              namespaces: ["kube-system", "argocd", "flux-system"]
      validate:
        message: "Deployments must have the label 'team'."
        pattern:
          metadata:
            labels:
              team: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]           # Kyverno generates rules for Deployments etc. automatically (autogen)
      validate:
        message: "Images need a tag."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: no-latest
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "The tag ':latest' is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-resources
spec:
  rules:
    - name: default-requests
      match:
        any:
          - resources:
              kinds: ["Pod"]
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"            # anchor: for every container
                resources:
                  requests:
                    +(cpu): 100m       # +( ) = only add if not present
                    +(memory): 128Mi
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: readiness
      match:
        any:
          - resources:
              kinds: ["Deployment"]
      validate:
        message: "Deployments should have a readinessProbe."
        pattern:
          spec:
            template:
              spec:
                containers:
                  - readinessProbe:
                      periodSeconds: ">0"
---
# 5.6.6 PolicyException (must be enabled in Kyverno: --enablePolicyException,
# namespace possibly restricted via --exceptionNamespace; API version v2 / v2beta1 depending on the release)
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: legacy-app-no-team
  namespace: legacy
spec:
  exceptions:
    - policyName: require-team-label
      ruleNames: ["check-team", "autogen-check-team"]
  match:
    any:
      - resources:
          kinds: ["Deployment"]
          namespaces: ["legacy"]
          names: ["legacy-app"]
