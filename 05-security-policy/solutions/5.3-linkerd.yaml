apiVersion: v1
kind: Namespace
metadata:
  name: mesh-demo
  annotations:
    linkerd.io/inject: enabled          # Linkerd nutzt eine ANNOTATION, Istio ein Label
---
# backend mit Label app=backend, Port 80 und ServiceAccount "backend" wird vorausgesetzt.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: backend-http
  namespace: mesh-demo
spec:
  podSelector:
    matchLabels:
      app: backend
  port: 80
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: frontend-only
  namespace: mesh-demo
spec:
  identityRefs:
    - kind: ServiceAccount
      name: frontend
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: backend-allow-frontend
  namespace: mesh-demo
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: backend-http
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: frontend-only
# Bestehende Pods neu starten, damit der Proxy injiziert wird:
#   kubectl -n mesh-demo rollout restart deploy
# mTLS prüfen:  linkerd check --proxy -n mesh-demo ; linkerd viz edges deploy -n mesh-demo
# Default-Policy (ohne Server): all-unauthenticated – per Annotation
#   config.linkerd.io/default-inbound-policy: deny  am Namespace verschärfen.
# API-Versionen variieren je Linkerd-Release → kubectl api-resources --api-group=policy.linkerd.io
