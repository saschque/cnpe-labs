apiVersion: v1
kind: Namespace
metadata:
  name: mesh-demo
  annotations:
    linkerd.io/inject: enabled          # Linkerd uses an ANNOTATION, Istio a label
---
# assumes a backend with label app=backend, port 80 and ServiceAccount "backend".
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: backend-http
  namespace: mesh-demo
spec:
  podSelector:
    matchLabels:
      app: backend
  port: 80
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: frontend-only
  namespace: mesh-demo
spec:
  identityRefs:
    - kind: ServiceAccount
      name: frontend
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: backend-allow-frontend
  namespace: mesh-demo
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: backend-http
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: frontend-only
# Restart existing pods so the proxy gets injected:
#   kubectl -n mesh-demo rollout restart deploy
# Check mTLS:  linkerd check --proxy -n mesh-demo ; linkerd viz edges deploy -n mesh-demo
# Default policy (without a Server): all-unauthenticated – tighten it with the annotation
#   config.linkerd.io/default-inbound-policy: deny  on the namespace.
# API versions vary per Linkerd release → kubectl api-resources --api-group=policy.linkerd.io
